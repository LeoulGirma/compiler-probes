name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # site/index.html is the fragment the artifact host wraps; on Pages the Start page is the full document
      - name: Assemble
        run: |
          mkdir _site
          cp site/{start,watch,concepts,probes,net11,load,containers,takeaways}.html site/explainer.mp4 site/explainer-vtt.txt site/explainer-poster.jpg site/og.jpg site/robots.txt site/sitemap.xml site/google*.html _site/
          cp site/start.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
