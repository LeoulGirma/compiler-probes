[package]
name = "paysvc"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
# cargo's defaults (opt-level 3, no LTO): the out-of-the-box release build, same as the other probes
